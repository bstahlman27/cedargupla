<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cedar Pages</title>
	<style>
		html, body{
			height: 100%;
			margin: 0;
			display: flex;
			flex-direction: column;
		}
		body{
			max-width: 1200px;
			margin: 0 auto;
			background-color: #040404;
			color: white;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif
		}
		header, footer{
			text-align: center;
			padding: 5px;
			width: 100%;
			box-sizing: border-box;
		}
		header{
			border-bottom: 1px solid lightslategray;
			padding: 0 20px;
			color: orange;
		}
		footer{
			border-top: 1px solid lightslategray;
		}
		h1{
			font-size: 35px;
			transform: skewX(-5deg);
			margin: 10px 0;
		}
		h2, h3{
			transform: skewX(-5deg);
			font-weight: bold;
			color: orange;
		}
		h3, h4{
			margin-top: 0;
			font-weight: bold;
		}
		main{
			padding: 20px;
			flex: 1;
		}
		a{
			color: orange;
			text-decoration: none;
			border-radius: 6px;
			padding: 2px;
		}
		a:hover{
			background-color: orange;
			color: #030213;
			transition: background-color 0.3s ease;
		}
		.about-section, .projects-section{
			margin-top: 2rem;
			background-color: rgb(3, 48, 3);
			padding: 1rem;
			border-radius: 8px;
			border: 1px solid orange;
		}
		.projects-section .card{
			background-color:#040404;
			color: white;
			border-radius: 8px;
			margin-bottom: 1.5rem;
		}
		.projects-section .card h4{
			margin-bottom: 0.5rem;
			font-size: 1.2rem;
		}
		.card-links-row{
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			justify-content: space-between;
		}
		.card-links-row a{
			flex: 1 1 48%;
		text-align: center;
		color: white;
		font-weight: bold;
		border-radius: 6px;
		padding: 0.75rem 1rem;
		border: 1px solid orange;
		box-sizing: border-box;
		}
		.card-link{
			display: block;
			text-align: center;
			color: white;
			font-weight: bold;
			border-radius: 6px;
			padding: 0.75rem 1rem;
			border: 1px solid orange;
		}
		.card-link:hover{
			background-color: orange;
			color:#030213;
			transition: background-color 0.3s ease;
		}
		@media screen and (min-width: 600px) and (max-width: 980px){
    		main{
        		width: 95%;
        		margin-left: 5%;
        		margin-right: 5%;
    		}
    		body{
       			 font-size: 16px;
    		}
		}
		@media screen and (min-width: 370px) and (max-width: 600px){
    		main{
       			width: 95%;
        		margin-left: 0;
        		margin-right: 0;
    		}
    		body{
        		font-size: 14px;
        		text-align: left;
    		}
		}
	</style>
</head>
<body>
	<header>
		<h1>Cedar Gupla Pages</h1>
	</header>
	<main>
		<div class="home-section">
			<h2>Home</h2>
			<p>More to come haha lol </p>
		</div>
		<div class="projects-section">
			<h3>Links</h3>
			<div class="card">
				<a href="tally.html" class="card-link">L Bozo + Ratio</a>
			</div>
		</div>
	</main>
	<footer>
		<p>Page intended for <b>Cedar Gupla</b> members + Chuck Mangione Listeners</p>
	</footer>
</body>
</html>
